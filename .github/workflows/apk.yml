name: Construire l'APK Android

on:
  push:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'js/**'
      - 'vendor/**'
      - 'icons/**'
      - 'tools/build_single.py'
      - 'android/**'
      - 'formulaires/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # L'appli est empaquetée en « fichier unique ». Les formulaires vierges
      # (formulaires/justificatif.pdf et formulaires/convention.pdf) sont inclus
      # s'ils sont présents dans le dépôt ; sinon chacun les importe dans Réglages.
      - name: Construire l'appli (fichier unique)
        run: |
          OPTS=""
          if [ -f formulaires/justificatif.pdf ]; then OPTS="$OPTS --justificatif formulaires/justificatif.pdf"; fi
          if [ -f formulaires/convention.pdf ]; then OPTS="$OPTS --convention formulaires/convention.pdf"; fi
          echo "Formulaires inclus :$OPTS"
          python3 tools/build_single.py android/app/src/main/assets/index.html $OPTS

      - name: Clé de signature (si fournie dans les secrets du dépôt)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks; fi

      - name: Compiler l'APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Ranger l'APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/Covoiturage.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Covoiturage-apk
          path: apk/Covoiturage.apk

      - name: Déposer l'APK dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/Covoiturage.apk
          git commit -m "APK Android v1.${{ github.run_number }}" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
